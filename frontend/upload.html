<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Importar Excel</title>
</head>
<body>
  <h2>Importar arquivo Excel</h2>

  <form id="formExcel" enctype="multipart/form-data">
    <input type="file" name="arquivo" id="arquivo" accept=".xlsx, .xls" required>
    <button type="submit">Enviar</button>
  </form>

  <p id="resultado"></p>

  <script>
    const form = document.getElementById("formExcel");
    const resultado = document.getElementById("resultado");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const arquivo = document.getElementById("arquivo").files[0];
      const formData = new FormData();
      formData.append("arquivo", arquivo);

      const res = await fetch("http://localhost:3000/api/importar-excel", {
        method: "POST",
        body: formData
      });

      const dados = await res.json();
      resultado.textContent = JSON.stringify(dados, null, 2);
    });
  </script>
</body>
</html>
