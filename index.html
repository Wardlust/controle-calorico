<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <head>
    <link rel="stylesheet" href="style.css">
    </head>
    <meta charset="UTF-8">
    <title>Controle Calórico Semanal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f4f4f4;
        }

        h1 {
            text-align: center;
        }

        .card {
            background: white;
            padding: 20px;
            margin: 20px auto;
            width: 80%;
            border-radius: 8px;
            box-shadow: 0 0 8px rgba(0,0,0,0.1);
        }

        button {
            margin-top: 8px;
            padding: 10px 20px;
            cursor: pointer;
        }

        .refeicao-card {
            background: #fafafa;
            padding: 15px;
            margin: 10px 0;
            border-left: 4px solid #4285f4;
        }

        #mensagem {
            margin-top: 10px;
        }
    </style>
</head>
<body>

  <h1>Controle Calórico Semanal</h1>
<p class="subtitulo">ALANSAB - Associação Lar e Abrigo Nossa Senhora do Brasil</p>

    <!-- UPLOAD DE EXCEL -->
    <section class="card">
        <h2>Importar arquivo Excel</h2>
        <input type="file" id="arquivoExcel" accept=".xlsx, .xls">
       <button id="enviar-btn">Enviar</button>
        <p id="mensagem"></p>
    </section>

    <!-- LISTAGEM DAS REFEIÇÕES -->
<section class="card">
    <h2>Cardápio do Dia</h2>
    
    <select id="seletorDia" onchange="exibirDiaSelecionado(this.value)">
        </select>
    
    <div id="listaRefeicoes" class="mt-3">
        </div>
</section>

    <!-- SCRIPT -->
    <script src="script.js"></script>
</body>
</html>
